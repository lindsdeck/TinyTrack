<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/header :: header('TinyTrack | Centers')}">
</head>

<body>

<div th:replace="~{fragments/navigation :: navigation}"></div>

<main class="container">

    <h1 class="page-title">Center Information</h1>

    <section class="panel">

        <table class="data-table">

            <thead>
                <tr>
                    <th>Name</th>
                    <th>Address</th>
                    <th>City</th>
                    <th>State</th>
                    <th>Phone</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="center : ${centers}">

                    <td th:text="${center.centerName}"></td>

                    <td th:text="${center.address}"></td>

                    <td th:text="${center.city}"></td>

                    <td th:text="${center.state}"></td>

                    <td th:text="${center.phoneNumber}"></td>

                </tr>

            </tbody>

        </table>

    </section>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>

</html>
